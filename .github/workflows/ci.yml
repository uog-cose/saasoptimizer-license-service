name: Component CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then printf '%s\n' "$unformatted"; exit 1; fi
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./... 2>&1 | tee "$RUNNER_TEMP/go-test.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-test-log
          path: ${{ runner.temp }}/go-test.log
          if-no-files-found: warn
          retention-days: 7
